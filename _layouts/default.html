<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{ page.title }}</title>
<style>
@font-face { font-family: "Instrument Serif"; src: url("fonts/InstrumentSerif-Regular.ttf") format("truetype"); font-display: swap; }
:root { --bg: #FBF8F2; --text: #2A241E; --muted: #7A6F62; --link: #2F4F86; }
@media (prefers-color-scheme: dark) { :root { --bg: #1A1714; --text: #EDE6DC; --muted: #A89C8D; --link: #8FA8D6; } }
body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.55 -apple-system, system-ui, sans-serif; }
main { max-width: 34em; margin: 0 auto; padding: 48px 22px 80px; }
h1 { font: 400 40px/1.1 "Instrument Serif", Georgia, serif; margin: 0 0 6px; }
h1 + p { color: var(--muted); font-size: 15px; margin-bottom: 28px; }
h2 { font: 600 15px/1.4 inherit; margin: 48px 0 8px; }
p { margin: 0 0 14px; }
a { color: var(--link); }
</style>
</head>
<body>
<main>
{{ content }}
</main>
</body>
</html>
